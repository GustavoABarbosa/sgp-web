name: CI

on:
  push:
    paths:
      - 'SGP Católica/sgp-web/**'
  pull_request:
    paths:
      - 'SGP Católica/sgp-web/**'

defaults:
  run:
    working-directory: SGP Católica/sgp-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SGP Católica/sgp-web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
